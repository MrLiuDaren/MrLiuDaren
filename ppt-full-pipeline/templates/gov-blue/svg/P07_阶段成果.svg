<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="navGrad" x1="0" y1="0.5" x2="1" y2="0.5">
      <stop offset="0.53" stop-color="#2F5597"/><stop offset="1" stop-color="#4874CB" stop-opacity="0.58"/>
    </linearGradient>
    <linearGradient id="pgGrad" x1="-0.1" y1="0.28" x2="1.1" y2="0.72">
      <stop offset="0" stop-color="#034581"/><stop offset="1" stop-color="#6CAFEF"/>
    </linearGradient>
    <linearGradient id="barGrad" x1="0" y1="0.5" x2="1" y2="0.5">
      <stop offset="0.02" stop-color="#2F5597" stop-opacity="0.79"/><stop offset="0.75" stop-color="#2F5597"/><stop offset="1" stop-color="#2F5597" stop-opacity="0.79"/>
    </linearGradient>
    <filter id="cardGlow" x="-5%" y="-5%" width="110%" height="110%">
      <feMorphology operator="dilate" radius="3" in="SourceAlpha" result="dilated"/>
      <feGaussianBlur in="dilated" stdDeviation="7" result="blurred"/>
      <feFlood flood-color="#1764FC" flood-opacity="0.2" result="flood"/>
      <feComposite in="flood" in2="blurred" operator="in" result="glow"/>
      <feMerge><feMergeNode in="glow"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect x="0" y="-6" width="1280" height="725" fill="#2F5597"/>
  <rect x="29" y="52" width="1221" height="614" fill="#FFFFFF" filter="url(#cardGlow)"/>
  <rect x="0" y="0" width="1280" height="69" fill="url(#navGrad)"/>
  <polygon points="3,0 54,0 15,80 -37,80" fill="#034581"/>
  <polygon points="44,9 84,9 54,71 14,71" fill="url(#pgGrad)"/>
  <text x="77" y="45" font-family="微软雅黑, SimHei, sans-serif" font-size="37" fill="#FFFFFF" font-weight="bold">二、着力推动城市治理业务上平台</text>
  <!-- 子标题 -->
  <rect x="18" y="148" width="1256" height="51" rx="4" fill="url(#barGrad)"/>
  <text x="55" y="185" font-family="微软雅黑, SimHei, sans-serif" font-size="32" fill="#FFFFFF" font-weight="bold">（三）阶段成果与数据展示</text>
  <!-- 中央数据卡片 -->
  <rect x="40" y="220" width="1200" height="360" fill="#F8FAFC" rx="8" stroke="#B6C7EA" stroke-width="1"/>
  <text x="640" y="260" font-family="微软雅黑, SimHei, sans-serif" font-size="24" fill="#2F5597" font-weight="bold" text-anchor="middle">融合办公阶段成效</text>
  <rect x="540" y="275" width="200" height="3" fill="#4874CB"/>
  <!-- KPI卡片行 -->
  <rect x="80" y="310" width="250" height="110" rx="8" fill="#FFFFFF" stroke="#3D68BF" stroke-width="1.3"/>
  <text x="205" y="345" font-family="微软雅黑, SimHei, sans-serif" font-size="16" fill="#64748B" font-weight="bold" text-anchor="middle">累计识别风险点</text>
  <text x="205" y="395" font-family="微软雅黑, SimHei, sans-serif" font-size="42" fill="#C00000" font-weight="bold" text-anchor="middle">XX处</text>

  <rect x="365" y="310" width="250" height="110" rx="8" fill="#FFFFFF" stroke="#3D68BF" stroke-width="1.3"/>
  <text x="490" y="345" font-family="微软雅黑, SimHei, sans-serif" font-size="16" fill="#64748B" font-weight="bold" text-anchor="middle">已完成处置</text>
  <text x="490" y="395" font-family="微软雅黑, SimHei, sans-serif" font-size="42" fill="#2F5597" font-weight="bold" text-anchor="middle">XX处</text>

  <rect x="650" y="310" width="250" height="110" rx="8" fill="#FFFFFF" stroke="#3D68BF" stroke-width="1.3"/>
  <text x="775" y="345" font-family="微软雅黑, SimHei, sans-serif" font-size="16" fill="#64748B" font-weight="bold" text-anchor="middle">平台汇聚数据</text>
  <text x="775" y="395" font-family="微软雅黑, SimHei, sans-serif" font-size="42" fill="#2F5597" font-weight="bold" text-anchor="middle">XX万条</text>

  <rect x="935" y="310" width="250" height="110" rx="8" fill="#FFFFFF" stroke="#3D68BF" stroke-width="1.3"/>
  <text x="1060" y="345" font-family="微软雅黑, SimHei, sans-serif" font-size="16" fill="#64748B" font-weight="bold" text-anchor="middle">部门协同联动</text>
  <text x="1060" y="395" font-family="微软雅黑, SimHei, sans-serif" font-size="42" fill="#2F5597" font-weight="bold" text-anchor="middle">XX个</text>

  <!-- 第二行说明 -->
  <text x="640" y="470" font-family="微软雅黑, SimHei, sans-serif" font-size="19" fill="#64748B" font-weight="bold" text-anchor="middle">（数据截至2026年5月，具体数字以最终统计为准）</text>
  <rect x="380" y="495" width="520" height="2" fill="#E2E8F0"/>

  <rect x="80" y="515" width="1120" height="50" rx="6" fill="#4874CB" fill-opacity="0.08"/>
  <text x="200" y="545" font-family="微软雅黑, SimHei, sans-serif" font-size="19" fill="#2F5597" font-weight="bold">核心亮点：</text>
  <text x="340" y="545" font-family="微软雅黑, SimHei, sans-serif" font-size="19" fill="#4264A0" font-weight="bold">① 首次实现跨部门数据实时共享  ② 巡查效率提升XX%  ③ 处置周期缩短至XX小时</text>
  <!-- 底部结论 -->
  <rect x="24" y="605" width="1210" height="59" rx="10" fill="#2F5597"/>
  <text x="630" y="639" font-family="微软雅黑, SimHei, sans-serif" font-size="24" fill="#FFFFFF" font-weight="bold" text-anchor="middle">融合办公初见成效，为全市推广奠定坚实基础</text>
</svg>
