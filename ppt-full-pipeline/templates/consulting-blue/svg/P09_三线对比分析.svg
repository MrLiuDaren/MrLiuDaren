<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dx="0" dy="2"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.1"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect x="0" y="0" width="1280" height="720" fill="#F8FAFC"/>
  <rect x="0" y="0" width="1280" height="4" fill="#1E3A5F"/>
  <rect x="0" y="4" width="1280" height="56" fill="#FFFFFF"/>
  <text x="60" y="38" font-family="PingFang SC, Microsoft YaHei, SimHei, sans-serif" font-size="14" fill="#1E3A5F" font-weight="600">沙坪坝区道路精细化提质</text>
  <rect x="260" y="22" width="1" height="20" fill="#E2E8F0"/>
  <text x="280" y="38" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="14" fill="#F59E0B">02 现状分析</text>
  <text x="1220" y="38" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="14" fill="#64748B" text-anchor="end">9 / 20</text>
  <rect x="0" y="60" width="1280" height="1" fill="#E2E8F0"/>
  <text x="60" y="105" font-family="PingFang SC, Microsoft YaHei, SimHei, sans-serif" font-size="28" font-weight="700" fill="#1E3A5F">2.3.3-2.3.6 三线对比分析</text>

  <g filter="url(#cardShadow)"><rect x="60" y="140" width="370" height="380" rx="8" fill="#FFFFFF"/><rect x="60" y="140" width="370" height="6" rx="3" fill="#E63946"/>
    <text x="245" y="180" font-family="PingFang SC, Microsoft YaHei, SimHei, sans-serif" font-size="20" font-weight="700" fill="#E63946" text-anchor="middle">路线一 · 商圈生活线</text>
    <text x="245" y="210" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="14" fill="#64748B" text-anchor="middle">石小路—龙泉路—汉渝路—三峡广场</text>
    <rect x="85" y="230" width="320" height="1" fill="#E2E8F0"/>
    <text x="245" y="265" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="48" font-weight="700" fill="#E63946" text-anchor="middle">1,398</text>
    <text x="245" y="290" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="14" fill="#64748B" text-anchor="middle">项 (79.3%)</text>
    <rect x="100" y="310" width="290" height="30" rx="4" fill="#FEE2E2"/><text x="245" y="330" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="13" fill="#E63946" text-anchor="middle">6条路 · 约6.7km</text>
    <text x="85" y="370" font-family="PingFang SC, Microsoft YaHei, SimHei, sans-serif" font-size="13" fill="#334155"><tspan x="85" dy="0">核心特征：停车+人行道双主线</tspan><tspan x="85" dy="20">汉渝路491项为全线之最</tspan><tspan x="85" dy="20">盲道阻断+围挡倒塌=安全高危</tspan></text>
    <rect x="100" y="470" width="290" height="35" rx="6" fill="#E63946"/><text x="245" y="493" font-family="PingFang SC, Microsoft YaHei, SimHei, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">全线重点攻坚</text>
  </g>

  <g filter="url(#cardShadow)"><rect x="455" y="140" width="370" height="380" rx="8" fill="#FFFFFF"/><rect x="455" y="140" width="370" height="6" rx="3" fill="#2ECC71"/>
    <text x="640" y="180" font-family="PingFang SC, Microsoft YaHei, SimHei, sans-serif" font-size="20" font-weight="700" fill="#2ECC71" text-anchor="middle">路线二 · 滨江风貌线</text>
    <text x="640" y="210" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="14" fill="#64748B" text-anchor="middle">沙滨路（兰渝铁路→红岩村大桥）</text>
    <rect x="480" y="230" width="320" height="1" fill="#E2E8F0"/>
    <text x="640" y="265" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="48" font-weight="700" fill="#2ECC71" text-anchor="middle">32</text>
    <text x="640" y="290" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="14" fill="#64748B" text-anchor="middle">项 (1.8%)</text>
    <rect x="495" y="310" width="290" height="30" rx="4" fill="#ECF8F0"/><text x="640" y="330" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="13" fill="#2ECC71" text-anchor="middle">1条路 · 约14.5km</text>
    <text x="480" y="370" font-family="PingFang SC, Microsoft YaHei, SimHei, sans-serif" font-size="13" fill="#334155"><tspan x="480" dy="0">核心特征：管护水平较好</tspan><tspan x="480" dy="20">问题以护栏锈蚀+少量占道为主</tspan><tspan x="480" dy="20">属日常维护范畴</tspan></text>
    <rect x="495" y="470" width="290" height="35" rx="6" fill="#2ECC71"/><text x="640" y="493" font-family="PingFang SC, Microsoft YaHei, SimHei, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">精细管护为主</text>
  </g>

  <g filter="url(#cardShadow)"><rect x="850" y="140" width="370" height="380" rx="8" fill="#FFFFFF"/><rect x="850" y="140" width="370" height="6" rx="3" fill="#F59E0B"/>
    <text x="1035" y="180" font-family="PingFang SC, Microsoft YaHei, SimHei, sans-serif" font-size="20" font-weight="700" fill="#F59E0B" text-anchor="middle">路线三 · 交通主干线</text>
    <text x="1035" y="210" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="14" fill="#64748B" text-anchor="middle">科学大道+经纬大道（沙坪坝段）</text>
    <rect x="875" y="230" width="320" height="1" fill="#E2E8F0"/>
    <text x="1035" y="265" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="48" font-weight="700" fill="#F59E0B" text-anchor="middle">334</text>
    <text x="1035" y="290" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="14" fill="#64748B" text-anchor="middle">项 (18.9%)</text>
    <rect x="890" y="310" width="290" height="30" rx="4" fill="#FEF3E2"/><text x="1035" y="330" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="13" fill="#F59E0B" text-anchor="middle">2条路 · 约4.8km</text>
    <text x="875" y="370" font-family="PingFang SC, Microsoft YaHei, SimHei, sans-serif" font-size="13" fill="#334155"><tspan x="875" dy="0">核心特征：护栏锈蚀+车行道裂缝</tspan><tspan x="875" dy="20">建筑外立面脏污突出</tspan><tspan x="875" dy="20">以长线型基础设施问题为主</tspan></text>
    <rect x="890" y="470" width="290" height="35" rx="6" fill="#F59E0B"/><text x="1035" y="493" font-family="PingFang SC, Microsoft YaHei, SimHei, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">分类精准施治</text>
  </g>

  <g filter="url(#cardShadow)"><rect x="60" y="540" width="1160" height="80" rx="8" fill="#FFFFFF"/><rect x="60" y="540" width="1160" height="4" rx="2" fill="#2D6A4F"/>
    <text x="640" y="575" font-family="PingFang SC, Microsoft YaHei, SimHei, sans-serif" font-size="18" font-weight="700" fill="#1E3A5F" text-anchor="middle">三线梯度格局：商圈(1,398) &gt;&gt; 主干线(334) &gt;&gt; 滨江(32)</text>
    <text x="640" y="600" font-family="PingFang SC, Microsoft YaHei, SimHei, sans-serif" font-size="14" fill="#64748B" text-anchor="middle">停车管理是三条线共性问题 · 商圈生活线反映核心区精细化管护面临更大压力</text>
  </g>
  <text x="60" y="700" font-family="PingFang SC, Microsoft YaHei, SimHei, sans-serif" font-size="11" fill="#94A3B8">数据来源：三线问题总汇总  |  注：需替换为实际数据图表（柱状图 + 严重度对比图）</text>
</svg>
