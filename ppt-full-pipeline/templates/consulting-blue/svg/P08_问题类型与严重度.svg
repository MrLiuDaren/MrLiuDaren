    <text x="95" y="270" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12" fill="#64748B">市容秩序<rect x="200" y="260" width="85" height="14" rx="3" fill="#2D6A4F"/><tspan dx="8" fill="#334155">138</tspan></text>
    <text x="95" y="290" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12" fill="#64748B">户外招牌<rect x="200" y="280" width="80" height="14" rx="3" fill="#2D6A4F"/><tspan dx="8" fill="#334155">127</tspan></text>
    <text x="95" y="310" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12" fill="#64748B">井盖维护<rect x="200" y="300" width="75" height="14" rx="3" fill="#2D6A4F"/><tspan dx="8" fill="#334155">122</tspan></text>
