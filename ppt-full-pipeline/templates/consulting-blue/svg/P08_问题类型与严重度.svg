  <text x="60" y="700" font-family="PingFang SC, Microsoft YaHei, SimHei, sans-serif" font-size="11" fill="#94A3B8">数据来源：AI视觉巡查+人工复核  |  注：需替换为实际图表（条形图 + 饼图）</text>
