    <text x="95" y="390" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12" fill="#64748B">施工围挡<rect x="200" y="380" width="25" height="14" rx="3" fill="#2D6A4F"/><tspan dx="8" fill="#334155">43</tspan></text>
    <text x="95" y="415" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" fill="#94A3B8">Top3占比54.9%，停车+人行道为两条并行主线</text>
  </g>

  <g filter="url(#cardShadow)"><rect x="700" y="140" width="520" height="300" rx="8" fill="#FFFFFF"/><rect x="700" y="140" width="4" height="300" rx="2" fill="#E63946"/>
    <text x="725" y="175" font-family="PingFang SC, Microsoft YaHei, SimHei, sans-serif" font-size="18" font-weight="600" fill="#1E3A5F">严重度分布</text>
