    <text x="952" y="345" font-family="PingFang SC, Microsoft YaHei, SimHei, sans-serif" font-size="16" fill="#E63946" text-anchor="middle">重度 175项 (9.9%)</text>
    <text x="952" y="368" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="13" fill="#64748B" text-anchor="middle">集中在汉渝路 · 盲道阻断+围挡倒塌</text>

    <text x="725" y="420" font-family="PingFang SC, Microsoft YaHei, SimHei, sans-serif" font-size="12" fill="#64748B"><tspan x="725" dy="0">■ 轻度：外观瑕疵，可通过日常管护快速消项</tspan><tspan x="725" dy="16">■ 中度：功能受限，需集中整治</tspan><tspan x="725" dy="16">■ 重度：安全隐患，列入优先整改清单</tspan></text>
  </g>

  <g filter="url(#cardShadow)"><rect x="60" y="460" width="1160" height="80" rx="8" fill="#FFFFFF"/><rect x="60" y="460" width="1160" height="4" rx="2" fill="#E63946"/>
    <text x="85" y="495" font-family="PingFang SC, Microsoft YaHei, SimHei, sans-serif" font-size="16" font-weight="600" fill="#E63946">核心发现</text>
    <text x="85" y="520" font-family="PingFang SC, Microsoft YaHei, SimHei, sans-serif" font-size="14" fill="#334155">停车+人行道两项合计780项，占总量44.2%。商圈生活线6路合占79.3% —— 先解决商圈 = 解决逾八成问题</text>
