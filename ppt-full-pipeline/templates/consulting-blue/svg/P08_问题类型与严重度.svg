    <text x="95" y="350" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12" fill="#64748B">飞线占道<rect x="200" y="340" width="45" height="14" rx="3" fill="#2D6A4F"/><tspan dx="8" fill="#334155">75</tspan></text>
