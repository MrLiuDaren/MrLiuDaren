    <text x="95" y="210" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12" fill="#64748B">停车秩序整治<rect x="200" y="200" width="250" height="14" rx="3" fill="#E63946"/><tspan dx="8" fill="#334155">396</tspan></text>
    <text x="95" y="230" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12" fill="#64748B">人行道维护<rect x="200" y="220" width="240" height="14" rx="3" fill="#F59E0B"/><tspan dx="8" fill="#334155">384</tspan></text>
