    <text x="835" y="235" font-family="PingFang SC, Microsoft YaHei, SimHei, sans-serif" font-size="16" fill="#2D6A4F" text-anchor="middle">轻度</text>
    <text x="835" y="275" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="36" font-weight="700" fill="#2ECC71" text-anchor="middle">1,258</text>
    <text x="835" y="293" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="14" fill="#64748B" text-anchor="middle">71.3%</text>

    <rect x="960" y="200" width="220" height="100" rx="8" fill="#FEF3E2"/>
    <text x="1070" y="235" font-family="PingFang SC, Microsoft YaHei, SimHei, sans-serif" font-size="16" fill="#F59E0B" text-anchor="middle">中度</text>
