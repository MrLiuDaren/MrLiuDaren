    <text x="640" y="400" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="13" fill="#334155" text-anchor="middle"><tspan x="640" dy="0">C1 绿化品质</tspan><tspan x="640" dy="20">C2 建筑外立面</tspan><tspan x="640" dy="20">C3 户外广告/招牌</tspan><tspan x="640" dy="20">C4 市容整洁度</tspan></text>
