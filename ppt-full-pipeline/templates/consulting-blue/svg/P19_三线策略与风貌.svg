    <text x="640" y="285" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="13" fill="#64748B" text-anchor="middle">32项 · 1条路 · 约14.5km</text>
    <rect x="495" y="305" width="290" height="24" rx="4" fill="#ECF8F0"/><text x="640" y="322" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12" fill="#2D6A4F" text-anchor="middle">1I + 2II + 1III + 1IV · 精细管护</text>
    <text x="480" y="355" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12" fill="#334155"><tspan x="480" dy="0">①停车21项②人行道11项③立面11项</tspan><tspan x="480" dy="18">④护栏7项⑤绿化4项</tspan><tspan x="480" dy="18">三道贯通2.8km·夜景暖色灯带</tspan></text>
    <rect x="480" y="445" width="140" height="24" rx="4" fill="#ECF8F0"/><text x="550" y="462" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12" fill="#2D6A4F" text-anchor="middle">目标 S ≥ 80</text>
  </g>

  <g filter="url(#cardShadow)"><rect x="850" y="140" width="370" height="340" rx="8" fill="#FFFFFF"/><rect x="850" y="140" width="370" height="6" rx="3" fill="#F59E0B"/>
    <text x="1035" y="180" font-family="PingFang SC, Microsoft YaHei, SimHei, sans-serif" font-size="18" font-weight="700" fill="#F59E0B" text-anchor="middle">路线三 · 舒行走廊</text>
    <text x="1035" y="210" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="14" fill="#334155" text-anchor="middle">舒行绿廊 · 烟火人家</text>
