    <text x="245" y="285" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="13" fill="#64748B" text-anchor="middle">1,244项 · 6条路 · 约6.7km</text>
    <rect x="100" y="305" width="290" height="24" rx="4" fill="#FEE2E2"/><text x="245" y="322" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12" fill="#E63946" text-anchor="middle">4I + 2II + 2III · 全线管理攻坚</text>
    <text x="85" y="355" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12" fill="#334155"><tspan x="85" dy="0">①停车166项②占道80项③人行道73项</tspan><tspan x="85" dy="18">④围挡39项⑤立面76项⑥招牌35项</tspan><tspan x="85" dy="18">⑦绿化17项⑧飞线 ⑨市容</tspan></text>
    <rect x="85" y="445" width="140" height="24" rx="4" fill="#FEE2E2"/><text x="155" y="462" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12" fill="#E63946" text-anchor="middle">目标 S ≥ 70</text>
  </g>

  <g filter="url(#cardShadow)"><rect x="455" y="140" width="370" height="340" rx="8" fill="#FFFFFF"/><rect x="455" y="140" width="370" height="6" rx="3" fill="#2D6A4F"/>
