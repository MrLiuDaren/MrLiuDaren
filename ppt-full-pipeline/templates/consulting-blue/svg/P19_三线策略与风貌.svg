    <text x="1035" y="260" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="36" font-weight="700" fill="#F59E0B" text-anchor="middle">S = 65.0</text>
    <text x="1035" y="285" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="13" fill="#64748B" text-anchor="middle">334项 · 2条路 · 约4.8km</text>
    <rect x="890" y="305" width="290" height="24" rx="4" fill="#FEF3E2"/><text x="1035" y="322" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12" fill="#F59E0B" text-anchor="middle">3II + 2III + 2IV · 精准施治</text>
    <text x="875" y="355" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12" fill="#334155"><tspan x="875" dy="0">①停车52项②占道40项③人行道24项</tspan><tspan x="875" dy="18">④立面22项⑤招牌14项⑥绿化</tspan><tspan x="875" dy="18">口袋公园2处 · 智慧设施增设</tspan></text>
    <rect x="890" y="445" width="140" height="24" rx="4" fill="#FEF3E2"/><text x="960" y="462" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12" fill="#F59E0B" text-anchor="middle">目标 S ≥ 75</text>
  </g>

  <rect x="60" y="510" width="1160" height="50" rx="6" fill="#1E3A5F"/>
  <text x="640" y="540" font-family="PingFang SC, Microsoft YaHei, SimHei, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">总体策略：一票否决优先 → 功能修复跟进 → 品质提升并行 → 精细管护长效</text>

  <rect x="60" y="580" width="370" height="40" rx="6" fill="#FEE2E2"/><text x="245" y="605" font-family="PingFang SC, Microsoft YaHei, SimHei, sans-serif" font-size="14" fill="#E63946" text-anchor="middle">路线一 · 全线重点攻坚 · 高投入60-70%</text>
  <rect x="455" y="580" width="370" height="40" rx="6" fill="#ECF8F0"/><text x="640" y="605" font-family="PingFang SC, Microsoft YaHei, SimHei, sans-serif" font-size="14" fill="#2D6A4F" text-anchor="middle">路线二 · 轻量化快速见效 · 低投入5-10%</text>
  <rect x="850" y="580" width="370" height="40" rx="6" fill="#FEF3E2"/><text x="1035" y="605" font-family="PingFang SC, Microsoft YaHei, SimHei, sans-serif" font-size="14" fill="#F59E0B" text-anchor="middle">路线三 · 分步有序推进 · 中投入20-30%</text>
  <text x="60" y="700" font-family="PingFang SC, Microsoft YaHei, SimHei, sans-serif" font-size="11" fill="#94A3B8">数据来源：第六章一路一策  |  注：路线一问题数含三峡广场周边关联路段</text>
