  <text x="60" y="105" font-family="PingFang SC, Microsoft YaHei, SimHei, sans-serif" font-size="28" font-weight="700" fill="#1E3A5F">6.1-6.5 三线策略与风貌定位</text>

  <g filter="url(#cardShadow)"><rect x="60" y="140" width="370" height="340" rx="8" fill="#FFFFFF"/><rect x="60" y="140" width="370" height="6" rx="3" fill="#E63946"/>
    <text x="245" y="180" font-family="PingFang SC, Microsoft YaHei, SimHei, sans-serif" font-size="18" font-weight="700" fill="#E63946" text-anchor="middle">路线一 · 繁华走廊</text>
    <text x="245" y="210" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="14" fill="#334155" text-anchor="middle">商衢焕彩 · 时尚三峡</text>
    <rect x="85" y="225" width="320" height="1" fill="#E2E8F0"/>
