  <rect x="60" y="580" width="380" height="60" rx="6" fill="#EBF4FF"/><text x="250" y="608" font-family="PingFang SC, Microsoft YaHei, SimHei, sans-serif" font-size="16" font-weight="600" fill="#4A90D9" text-anchor="middle">路线一：繁华走廊 — 商衢焕彩 · 时尚三峡</text><text x="250" y="628" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12" fill="#64748B" text-anchor="middle">商圈活力门户 · 时尚 · 精致 · 有序</text>
  <rect x="455" y="580" width="380" height="60" rx="6" fill="#ECF8F0"/><text x="645" y="608" font-family="PingFang SC, Microsoft YaHei, SimHei, sans-serif" font-size="16" font-weight="600" fill="#2D6A4F" text-anchor="middle">路线二：江岸画廊 — 江风绿韵 · 流光沙滨</text><text x="645" y="628" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12" fill="#64748B" text-anchor="middle">滨江生态水岸 · 自然 · 通透 · 悠扬</text>
  <rect x="850" y="580" width="370" height="60" rx="6" fill="#FEF3E2"/><text x="1035" y="608" font-family="PingFang SC, Microsoft YaHei, SimHei, sans-serif" font-size="16" font-weight="600" fill="#F59E0B" text-anchor="middle">路线三：舒行走廊 — 舒行绿廊 · 烟火人家</text><text x="1035" y="628" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12" fill="#64748B" text-anchor="middle">交通品质示范 · 便捷 · 舒适 · 温馨</text>
