    <text x="85" y="255" font-family="PingFang SC, Microsoft YaHei, SimHei, sans-serif" font-size="13" fill="#64748B"><tspan x="85" dy="0">治乱阶段 · 基础功能恢复达标</tspan><tspan x="85" dy="20">道路病害整治 · 安全隐患消除</tspan><tspan x="85" dy="20">飞线清理 · 停车秩序治理</tspan></text>
