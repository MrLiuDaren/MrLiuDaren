<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dx="0" dy="2"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.1"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect x="0" y="0" width="1280" height="720" fill="#F8FAFC"/>
  <rect x="0" y="0" width="1280" height="4" fill="#1E3A5F"/>
  <rect x="0" y="4" width="1280" height="56" fill="#FFFFFF"/>
  <text x="60" y="38" font-family="PingFang SC, Microsoft YaHei, SimHei, sans-serif" font-size="14" fill="#1E3A5F" font-weight="600">沙坪坝区道路精细化提质</text>
  <rect x="260" y="22" width="1" height="20" fill="#E2E8F0"/>
  <text x="280" y="38" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="14" fill="#E63946">04 路段问题方向定位</text>
  <text x="1220" y="38" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="14" fill="#64748B" text-anchor="end">15 / 20</text>
  <rect x="0" y="60" width="1280" height="1" fill="#E2E8F0"/>
  <text x="60" y="105" font-family="PingFang SC, Microsoft YaHei, SimHei, sans-serif" font-size="28" font-weight="700" fill="#1E3A5F">4.1-4.4 问题分类 · 路段定位 · 整治方向</text>

  <g filter="url(#cardShadow)"><rect x="60" y="140" width="280" height="160" rx="8" fill="#FFFFFF"/><rect x="60" y="140" width="280" height="6" rx="3" fill="#2D6A4F"/>
    <text x="200" y="180" font-family="PingFang SC, Microsoft YaHei, SimHei, sans-serif" font-size="18" font-weight="700" fill="#2D6A4F" text-anchor="middle">景观品质型</text>
    <text x="200" y="210" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="14" fill="#334155" text-anchor="middle">主导 · 8条路 · 1,732项</text>
    <text x="200" y="240" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12" fill="#64748B" text-anchor="middle"><tspan x="200" dy="0">C类环境景观三线均不及格</tspan><tspan x="200" dy="16">建筑立面 · 广告招牌 · 绿化 · 飞线</tspan></text>
  </g>
  <g filter="url(#cardShadow)"><rect x="360" y="140" width="280" height="160" rx="8" fill="#FFFFFF"/><rect x="360" y="140" width="280" height="6" rx="3" fill="#E63946"/>
    <text x="500" y="180" font-family="PingFang SC, Microsoft YaHei, SimHei, sans-serif" font-size="18" font-weight="700" fill="#E63946" text-anchor="middle">管理缺位型</text>
    <text x="500" y="210" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="14" fill="#334155" text-anchor="middle">主导 · 1条路（沙滨路）</text>
    <text x="500" y="240" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12" fill="#64748B" text-anchor="middle"><tspan x="500" dy="0">D类全线&lt;60分</tspan><tspan x="500" dy="16">停车秩序 · 占道经营 · 施工管理</tspan></text>
  </g>
  <g filter="url(#cardShadow)"><rect x="660" y="140" width="280" height="160" rx="8" fill="#FFFFFF"/><rect x="660" y="140" width="280" height="6" rx="3" fill="#F59E0B"/>
    <text x="800" y="180" font-family="PingFang SC, Microsoft YaHei, SimHei, sans-serif" font-size="18" font-weight="700" fill="#F59E0B" text-anchor="middle">设施老化型</text>
    <text x="800" y="210" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="14" fill="#334155" text-anchor="middle">叠加 · 5条路 · 1,200项</text>
    <text x="800" y="240" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12" fill="#64748B" text-anchor="middle"><tspan x="800" dy="0">A类商圈生活线&lt;55分</tspan><tspan x="800" dy="16">车行道 · 人行道 · 井盖 · 护栏</tspan></text>
  </g>
  <g filter="url(#cardShadow)"><rect x="960" y="140" width="260" height="160" rx="8" fill="#FFFFFF"/><rect x="960" y="140" width="260" height="6" rx="3" fill="#4A90D9"/>
    <text x="1090" y="180" font-family="PingFang SC, Microsoft YaHei, SimHei, sans-serif" font-size="18" font-weight="700" fill="#4A90D9" text-anchor="middle">功能缺失型</text>
    <text x="1090" y="210" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="14" fill="#334155" text-anchor="middle">叠加 · 1条路（石小路）</text>
    <text x="1090" y="240" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12" fill="#64748B" text-anchor="middle"><tspan x="1090" dy="0">B类附属设施局部短板</tspan><tspan x="1090" dy="16">标志牌 · 照明★ · 围挡★</tspan></text>
  </g>

  <rect x="60" y="320" width="1160" height="1" fill="#E2E8F0"/>

  <text x="60" y="360" font-family="PingFang SC, Microsoft YaHei, SimHei, sans-serif" font-size="16" font-weight="600" fill="#1E3A5F">三线差异化整治方向</text>

  <g filter="url(#cardShadow)"><rect x="60" y="380" width="370" height="180" rx="8" fill="#FFFFFF"/><rect x="60" y="380" width="370" height="6" rx="3" fill="#E63946"/>
    <text x="245" y="420" font-family="PingFang SC, Microsoft YaHei, SimHei, sans-serif" font-size="18" font-weight="700" fill="#E63946" text-anchor="middle">路线一 · 管理攻坚</text>
    <text x="245" y="450" font-family="PingFang SC, Microsoft YaHei, SimHei, sans-serif" font-size="14" fill="#334155" text-anchor="middle"><tspan x="245" dy="0">高投入(60-70%)  |  S 53.1→≥70</tspan><tspan x="245" dy="22">9大方向并行：</tspan><tspan x="245" dy="20">停车·人行道·招牌·围挡·立面</tspan><tspan x="245" dy="20">盲道·井盖·飞线·市容·分类收集</tspan></text>
  </g>
  <g filter="url(#cardShadow)"><rect x="455" y="380" width="370" height="180" rx="8" fill="#FFFFFF"/><rect x="455" y="380" width="370" height="6" rx="3" fill="#2D6A4F"/>
    <text x="640" y="420" font-family="PingFang SC, Microsoft YaHei, SimHei, sans-serif" font-size="18" font-weight="700" fill="#2D6A4F" text-anchor="middle">路线二 · 精细管护</text>
    <text x="640" y="450" font-family="PingFang SC, Microsoft YaHei, SimHei, sans-serif" font-size="14" fill="#334155" text-anchor="middle"><tspan x="640" dy="0">低投入(5-10%)  |  S 69.7→≥80</tspan><tspan x="640" dy="22">日常维护为主 · 局部消项：</tspan><tspan x="640" dy="20">护栏除锈·非机动车停放·人行道修补</tspan><tspan x="640" dy="20">补充巡查覆盖面</tspan></text>
  </g>
  <g filter="url(#cardShadow)"><rect x="850" y="380" width="370" height="180" rx="8" fill="#FFFFFF"/><rect x="850" y="380" width="370" height="6" rx="3" fill="#F59E0B"/>
    <text x="1035" y="420" font-family="PingFang SC, Microsoft YaHei, SimHei, sans-serif" font-size="18" font-weight="700" fill="#F59E0B" text-anchor="middle">路线三 · 精准施治</text>
    <text x="1035" y="450" font-family="PingFang SC, Microsoft YaHei, SimHei, sans-serif" font-size="14" fill="#334155" text-anchor="middle"><tspan x="1035" dy="0">中投入(20-30%)  |  S 65.0→≥75</tspan><tspan x="1035" dy="22">问题导向精准提升：</tspan><tspan x="1035" dy="20">护栏除锈·立面清洗·车行道修补</tspan><tspan x="1035" dy="20">停车管理·井盖排查·绿化补植</tspan></text>
  </g>

  <rect x="60" y="600" width="1160" height="60" rx="6" fill="#1E3A5F"/>
  <text x="640" y="635" font-family="PingFang SC, Microsoft YaHei, SimHei, sans-serif" font-size="16" fill="#FFFFFF" text-anchor="middle">关键发现：景观品质型为全线最普遍主导 — C类环境景观得分是所有道路的最低分大类</text>
  <text x="60" y="700" font-family="PingFang SC, Microsoft YaHei, SimHei, sans-serif" font-size="11" fill="#94A3B8">数据来源：第四章路段问题方向定位 · 分类逻辑：主导=最低大类得分 · 叠加=得分&lt;55分大类</text>
</svg>
