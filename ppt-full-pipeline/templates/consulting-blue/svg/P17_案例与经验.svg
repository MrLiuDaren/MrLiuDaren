    <text x="500" y="330" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12" fill="#64748B" text-anchor="middle"><tspan x="500" dy="0">28条主次干道 · 56km绿化</tspan><tspan x="500" dy="16">三一机制 · 一路一档 · 乡土树种</tspan></text>
