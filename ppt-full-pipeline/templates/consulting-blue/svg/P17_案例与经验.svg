  <rect x="640" y="590" width="580" height="100" rx="8" fill="#FEE2E2"/>
  <text x="660" y="620" font-family="PingFang SC, Microsoft YaHei, SimHei, sans-serif" font-size="14" font-weight="600" fill="#E63946">经验四：长效管护机制</text>
