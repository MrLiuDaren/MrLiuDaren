<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dx="0" dy="2"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.1"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect x="0" y="0" width="1280" height="720" fill="#F8FAFC"/>
  <rect x="0" y="0" width="1280" height="4" fill="#1E3A5F"/>
  <rect x="0" y="4" width="1280" height="56" fill="#FFFFFF"/>
  <text x="60" y="38" font-family="PingFang SC, Microsoft YaHei, SimHei, sans-serif" font-size="14" fill="#1E3A5F" font-weight="600">沙坪坝区道路精细化提质</text>
  <rect x="260" y="22" width="1" height="20" fill="#E2E8F0"/>
  <text x="280" y="38" font-family="PingFang SC, Microsoft YaHei, SimHei, sans-serif" font-size="14" fill="#2D6A4F">01 项目概述</text>
  <text x="1220" y="38" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="14" fill="#64748B" text-anchor="end">4 / 20</text>
  <rect x="0" y="60" width="1280" height="1" fill="#E2E8F0"/>
  <text x="60" y="105" font-family="PingFang SC, Microsoft YaHei, SimHei, sans-serif" font-size="28" font-weight="700" fill="#1E3A5F">1.1 项目背景 &amp; 1.2 项目范围</text>

  <g filter="url(#cardShadow)"><rect x="60" y="140" width="580" height="250" rx="8" fill="#FFFFFF"/><rect x="60" y="140" width="4" height="250" rx="2" fill="#2D6A4F"/>
    <text x="85" y="175" font-family="PingFang SC, Microsoft YaHei, SimHei, sans-serif" font-size="18" font-weight="600" fill="#1E3A5F">项目背景</text>
    <text x="85" y="210" font-family="PingFang SC, Microsoft YaHei, SimHei, sans-serif" font-size="14" fill="#334155"><tspan x="85" dy="0">宏观政策：渝城治办〔2026〕1号文件</tspan><tspan x="85" dy="24">区域定位：十五五教育科研 · 品质消费 · 现代服务</tspan><tspan x="85" dy="24">核心挑战：设施老化 · 交通拥堵 · 生态不足 · 文化活化不足</tspan><tspan x="85" dy="24">总体要求：干净 · 整洁 · 有序 · 安全 · 美丽</tspan></text>
    <rect x="85" y="345" width="200" height="30" rx="4" fill="#ECF8F0"/>
    <text x="185" y="365" font-family="PingFang SC, Microsoft YaHei, SimHei, sans-serif" font-size="13" fill="#2D6A4F" text-anchor="middle">全要素 · 精细化 · 高标准</text>
  </g>

  <g filter="url(#cardShadow)"><rect x="660" y="140" width="560" height="250" rx="8" fill="#FFFFFF"/><rect x="660" y="140" width="4" height="250" rx="2" fill="#4A90D9"/>
    <text x="685" y="175" font-family="PingFang SC, Microsoft YaHei, SimHei, sans-serif" font-size="18" font-weight="600" fill="#1E3A5F">三条线路范围</text>
    <text x="685" y="210" font-family="PingFang SC, Microsoft YaHei, SimHei, sans-serif" font-size="14" fill="#334155">
      <tspan x="685" dy="0" font-weight="600" fill="#E63946">路线一 · 商圈生活线</tspan>
      <tspan x="685" dy="22">石小路—龙泉路—汉渝路—三峡广场商圈</tspan>
      <tspan x="685" dy="20">6条路 · 约6.7km · 1,398项问题</tspan>
      <tspan x="685" dy="26" font-weight="600" fill="#4A90D9">路线二 · 滨江风貌线</tspan>
      <tspan x="685" dy="22">沙滨路（兰渝铁路 → 红岩村大桥）</tspan>
      <tspan x="685" dy="20">1条路 · 约14.5km · 32项问题</tspan>
      <tspan x="685" dy="26" font-weight="600" fill="#F59E0B">路线三 · 交通主干线</tspan>
      <tspan x="685" dy="22">科学大道 + 经纬大道（沙坪坝段）</tspan>
      <tspan x="685" dy="20">2条路 · 约4.8km · 334项问题</tspan>
    </text>
  </g>

  <rect x="60" y="410" width="1160" height="270" rx="8" fill="#FFFFFF" filter="url(#cardShadow)"/>
  <text x="85" y="445" font-family="PingFang SC, Microsoft YaHei, SimHei, sans-serif" font-size="18" font-weight="600" fill="#1E3A5F">项目定位与目标</text>
  <rect x="85" y="460" width="1110" height="1" fill="#E2E8F0"/>
  <text x="85" y="495" font-family="PingFang SC, Microsoft YaHei, SimHei, sans-serif" font-size="14" fill="#334155">
    <tspan x="85" dy="0">市管重点 · 市管标准 · 市管跨区 · 属地为主 → 市级统筹、一贯到底</tspan>
    <tspan x="85" dy="26">从城市更新到城市焕新 | 从功能完善到品质提升 | 从空间重塑到文脉传承</tspan>
    <tspan x="85" dy="26">目标：路平 · 灯亮 · 线齐 · 牌洁 · 景美</tspan>
  </text>
  <rect x="85" y="595" width="250" height="60" rx="6" fill="#EBF4FF"/>
  <text x="210" y="620" font-family="PingFang SC, Microsoft YaHei, SimHei, sans-serif" font-size="14" fill="#4A90D9" text-anchor="middle">繁华走廊（商圈）</text>
  <text x="210" y="642" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12" fill="#64748B" text-anchor="middle">商圈活力门户</text>
  <rect x="355" y="595" width="250" height="60" rx="6" fill="#ECF8F0"/>
  <text x="480" y="620" font-family="PingFang SC, Microsoft YaHei, SimHei, sans-serif" font-size="14" fill="#2D6A4F" text-anchor="middle">江岸画廊（滨江）</text>
  <text x="480" y="642" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12" fill="#64748B" text-anchor="middle">滨江生态水岸</text>
  <rect x="625" y="595" width="250" height="60" rx="6" fill="#FEF3E2"/>
  <text x="750" y="620" font-family="PingFang SC, Microsoft YaHei, SimHei, sans-serif" font-size="14" fill="#F59E0B" text-anchor="middle">舒行走廊（主干线）</text>
  <text x="750" y="642" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12" fill="#64748B" text-anchor="middle">交通品质示范</text>
  <text x="60" y="700" font-family="PingFang SC, Microsoft YaHei, SimHei, sans-serif" font-size="11" fill="#94A3B8">数据来源：渝城治办〔2026〕1号《中心城区城市道路分级管控方案》</text>
</svg>
